name: AI integration check

on:
  push:
    branches:
      - "AI-integration"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_AI_PROJECT_SUMMARY: "false"
          NEXT_PUBLIC_AI_VOICE: "false"
